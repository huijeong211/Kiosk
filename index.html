<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>Beverage Kiosk System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Beverage Kiosk System</h1>

    <h2>카테고리</h2>

    <button onclick="displayMenus()">전체</button>
    <button onclick="filterCategory('Coffee')">Coffee</button>
    <button onclick="filterCategory('Ade')">Ade</button>
    <button onclick="filterCategory('Dessert')">Dessert</button>

    <hr>

    <h2>메뉴</h2>
    <div id="menu-container"></div>

    <hr>

    <h2>장바구니</h2>
    <div id="cart-container"></div>

    <h3 id="total-price">총 금액 : 0원</h3>

    <button onclick="processPayment()">결제하기</button>

    <!-- 🔥 수정: 기존 cancelOrder → 최근 주문 취소 -->
    <button onclick="cancelLastOrder()">최근 주문 취소</button>

    <hr>

    <div id="receipt"></div>

    <hr>

    <h2>매출 현황</h2>

    <div id="sales">
        총 주문 수 : 0<br>
        총 매출 : 0원
    </div>

    <hr>

    <!-- 🔥 추가: 주문 이력 -->
    <h2>주문 내역</h2>
    <div id="order-history"></div>

    <hr>

    <h2>재고 관리 (관리자)</h2>

    <select id="stock-menu">
        <option value="1">아메리카노</option>
        <option value="2">카페라떼</option>
        <option value="3">레몬에이드</option>
        <option value="4">치즈케이크</option>
    </select>

    <input type="number" id="stock-value" placeholder="재고 입력">

    <button onclick="updateStock()">재고 수정</button>

    <script src="script.js"></script>

</body>

</html>
